<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>輝立證券 | 專業投資者認證 Demo（系統自動識別路徑）</title>
  <style>
    :root {
      --bg-outer: #e5e7eb;
      --bg-phone: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --border-color: #e5e7eb;
      --success: #059669;
      --success-bg: #ecfdf5;
      --warning-bg: #fffbeb;
      --warning-border: #f59e0b;
      --warning-text: #92400e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-outer);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text-main);
    }

    /* 手機模擬外框 */
    .phone-frame {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-phone);
      border-radius: 32px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 860px;
      max-height: 92vh;
      border: 6px solid #1f2937;
    }

    /* 頂部狀態列 */
    .status-bar {
      background: #ffffff;
      padding: 10px 20px 6px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #111827;
    }

    /* App 導航列 */
    .app-header {
      background: #ffffff;
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .back-icon {
      font-size: 22px;
      color: #374151;
      cursor: pointer;
      padding-right: 12px;
      user-select: none;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      flex: 1;
      text-align: center;
      margin-right: 24px;
    }

    /* 內容滾動區 */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .step-view.active {
      display: flex;
    }

    /* 卡片與通用樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    p {
      font-size: 13.5px;
      color: #4b5563;
      line-height: 1.55;
    }

    /* 場景選擇按鈕 */
    .scenario-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .scenario-btn {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .scenario-btn.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .scenario-title {
      font-weight: 700;
      font-size: 14px;
      color: #111827;
      margin-bottom: 4px;
    }

    .scenario-desc {
      font-size: 12.5px;
      color: #4b5563;
    }

    /* 聯絡代表橫幅 */
    .rep-box {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #334155;
    }

    /* 風險披露滾動區 */
    .scroll-hint {
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 8px;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .scroll-hint.unlocked {
      background: var(--success-bg);
      color: var(--success);
    }

    .disclosure-scroll-box {
      height: 270px;
      overflow-y: auto;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #374151;
      line-height: 1.6;
    }

    .disclosure-scroll-box h3 {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      margin: 12px 0 6px;
    }

    .disclosure-scroll-box p {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .disclosure-scroll-box ul,
    .disclosure-scroll-box ol {
      padding-left: 18px;
      margin-bottom: 10px;
    }

    .disclosure-scroll-box li {
      margin-bottom: 6px;
    }

    /* Consent Boxes */
    .consent-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .consent-list.active {
      opacity: 1;
      pointer-events: auto;
    }

    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
    }

    .consent-item input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .consent-item label {
      font-size: 13px;
      color: #1f2937;
      line-height: 1.45;
      cursor: pointer;
    }

    /* 上傳區塊 (Path B) */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-zone.uploaded {
      border-color: var(--success);
      background: var(--success-bg);
    }

    /* 摘要表格 */
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13.5px;
    }

    .summary-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-row:first-child {
      padding-top: 0;
    }

    .summary-label {
      color: var(--text-muted);
    }

    .summary-val {
      font-weight: 600;
      color: #111827;
      text-align: right;
    }

    .warning-box {
      background: var(--warning-bg);
      border-left: 4px solid var(--warning-border);
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--warning-text);
    }

    /* OTP 輸入框 */
    .otp-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin: 14px 0;
    }

    .otp-box {
      width: 44px;
      height: 48px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
    }

    .otp-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 底部操作列 */
    .bottom-bar {
      background: #ffffff;
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      flex: 0.45;
    }

    .center-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
    }

    .center-icon.green {
      background: var(--success-bg);
      color: var(--success);
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- 頂部狀態列 -->
    <div class="status-bar">
      <span>10:30</span>
      <span>●●● 5G 🔋</span>
    </div>

    <!-- App 標題列 -->
    <div class="app-header">
      <span class="back-icon" id="header-back">‹</span>
      <span class="app-title">專業投資者認證</span>
    </div>

    <!-- 主內容區 -->
    <div class="screen-content" id="screen-content">

      <!-- ==================== 步驟 0：Demo 場景與介紹 ==================== -->
      <div class="step-view active" id="view-intro">
        <div class="card">
          <span class="badge">Demo 場景選擇</span>
          <p>系統會根據內部資產自動判定路徑。請選擇要演示的場景：</p>
          <div class="scenario-grid">
            <div class="scenario-btn selected" id="opt-path-a" onclick="selectScenario('A')">
              <div class="scenario-title">場景 A · 滿 800 萬（直接進入風險披露）</div>
              <div class="scenario-desc">內部資產 ≥ HKD 8,000,000，系統自動識別為 Path A，免資產核驗頁面直接進入風險披露。</div>
            </div>
            <div class="scenario-btn" id="opt-path-b" onclick="selectScenario('B')">
              <div class="scenario-title">場景 B · 未滿 800 萬（Path B 上傳證明）</div>
              <div class="scenario-desc">內部資產 &lt; HKD 8,000,000，系統自動引導上載外部資產證明。</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h1>專業投資者介紹</h1>
          <p style="margin-bottom: 10px;">根據香港《證券及期貨條例》及《證券及期貨（專業投資者）規則》，成為專業投資者可解鎖更豐富的投資產品。</p>
